name: format-den-3461
on:
  push:
    branches: [agent/den-3461-user-dashboard]
permissions:
  contents: write
concurrency:
  group: format-den-3461
  cancel-in-progress: false
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "embedded-alerts-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "style(DEN-3461): apply rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
